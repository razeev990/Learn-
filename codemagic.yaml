workflows:
  react-native-android:
    name: Ludo Supreme Android Build
    max_build_duration: 120

    environment:
      node: v22.11.0

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Check project files
        script: |
          echo "Current project files:"
          ls -la
          echo "Source files:"
          ls -la src || true

    artifacts:
      - build/**/*.apk
      - android/app/build/outputs/**/*.apk
